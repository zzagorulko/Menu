<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Їжа">
<title>Їжа</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0c0e;
  --bg2:#141418;
  --bg3:#1c1c22;
  --accent:#5aaa5a;
  --accent2:#3d8c3d;
  --accent-dim:rgba(90,170,90,0.12);
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.04);
  --text:#f2f2f7;
  --text2:#ababab;
  --text3:#666;
  --radius:16px;
  --radius-sm:10px;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,'SF Pro Display',sans-serif;
  min-height:100vh;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}

/* ── HEADER ── */
.header{
  padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header-left{}
.header-greeting{font-size:13px;color:var(--text3);margin-bottom:2px}
.header-title{font-size:26px;font-weight:700;letter-spacing:-0.5px;color:var(--text)}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(12,12,14,0.92);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  z-index:100;
  gap:4px;
}
.nav-btn{
  flex:1;
  padding:8px 4px 6px;
  border:none;
  background:none;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  color:var(--text3);
  font-size:10px;
  font-weight:500;
  border-radius:12px;
  transition:all 0.15s;
  position:relative;
}
.nav-btn.active{color:var(--accent)}
.nav-btn.active .nav-icon-wrap{background:var(--accent-dim)}
.nav-icon-wrap{
  width:36px;height:36px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;
}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:10px;letter-spacing:0.2px}

/* ── PAGES ── */
.page{display:none;padding:0 16px 16px}
.page.active{display:block}

/* ── SECTION HEADER ── */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 10px;
}
.section-title{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.section-sub{font-size:13px;color:var(--text3)}

/* ── CARDS ── */
.card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:10px;
  transition:border-color 0.2s;
}
.card.open{border-color:rgba(255,255,255,0.12)}
.card-header{
  padding:15px 16px;
  cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  user-select:none;
}
.card-title{font-weight:600;font-size:15px}
.card-desc{font-size:12px;color:var(--text3);margin-top:2px}
.card-body{display:none;border-top:1px solid var(--border2)}
.card.open .card-body{display:block}
.chevron{
  width:22px;height:22px;
  background:var(--bg3);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--text3);
  transition:transform 0.2s;
  flex-shrink:0;
}
.card.open .chevron{transform:rotate(180deg)}

/* ── ITEMS ── */
.item{border-bottom:1px solid var(--border2)}
.item:last-child{border-bottom:none}
.item-header{
  padding:12px 16px;
  cursor:pointer;
  display:flex;justify-content:space-between;align-items:flex-start;
}
.item-name{font-weight:600;font-size:14px}
.item-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center}
.kcal-badge{font-size:11px;color:#7bc97b;background:rgba(70,160,70,0.1);border-radius:5px;padding:1px 6px}
.prot-badge{font-size:11px;color:#7bb5d9;background:rgba(70,130,210,0.1);border-radius:5px;padding:1px 6px}
.tag{font-size:10px;background:rgba(255,255,255,0.06);border-radius:5px;padding:1px 6px;color:var(--text3)}
.item-body{display:none;padding:0 16px 14px;background:rgba(0,0,0,0.15)}
.item.open .item-body{display:block}
.item-chevron{font-size:10px;color:var(--text3);margin-top:3px;flex-shrink:0;transition:transform 0.2s}
.item.open .item-chevron{transform:rotate(180deg)}

/* ── METHOD TABS ── */
.method-tabs{
  display:flex;gap:6px;
  padding-top:12px;margin-bottom:12px;
  background:var(--bg3);
  border-radius:var(--radius-sm);
  padding:4px;
  margin-top:12px;
  margin-bottom:12px;
}
.mt-btn{
  flex:1;padding:7px 4px;
  border-radius:8px;border:none;
  cursor:pointer;
  background:none;
  color:var(--text3);font-size:11px;font-weight:600;
  transition:all 0.15s;
}
.mt-btn.active-g{background:#0a1a2a;color:#70b0d0}
.mt-btn.active-s{background:#1a100a;color:#d09060}
.mt-btn.active-o{background:#1a0a0a;color:#d06060}

.time-pill{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:20px;padding:4px 10px;
  font-size:11px;font-weight:500;
  margin-bottom:12px;
}
.tp-g{background:rgba(70,130,200,0.12);color:#70b0d0}
.tp-s{background:rgba(200,130,70,0.12);color:#d09060}
.tp-o{background:rgba(200,70,70,0.12);color:#d06060}

/* ── LABELS & STEPS ── */
.slabel{
  font-size:11px;font-weight:600;
  color:var(--text3);
  text-transform:uppercase;letter-spacing:0.8px;
  margin:12px 0 7px;
}
.ing-item{font-size:13px;color:var(--text2);margin-bottom:4px;display:flex;gap:8px;align-items:flex-start}
.ing-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px}
.step{display:flex;gap:10px;font-size:13px;color:var(--text2);margin-bottom:7px;line-height:1.5}
.step-num{
  background:var(--accent-dim);
  color:var(--accent);
  border-radius:6px;min-width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;
}

/* ── EXPAND BTNS ── */
.xbtn{
  width:100%;background:var(--bg3);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:9px 12px;font-size:12px;font-weight:600;
  cursor:pointer;text-align:left;
  display:flex;justify-content:space-between;align-items:center;
  margin-top:8px;color:var(--text2);
  transition:background 0.15s;
}
.xbtn:active{background:rgba(255,255,255,0.08)}
.expandable{display:none;margin-top:8px}
.expandable.open{display:flex;flex-wrap:wrap;gap:5px}
.expandable.open-col{display:flex;flex-direction:column;gap:4px}
.pair-chip{
  font-size:12px;
  background:var(--accent-dim);
  border:1px solid rgba(90,170,90,0.2);
  border-radius:20px;padding:4px 10px;color:#90c090;
}
.sub-row{font-size:13px;color:var(--text2);padding-left:4px;display:flex;gap:6px;align-items:flex-start}
.sub-arrow{color:var(--accent);font-size:11px;margin-top:2px}

/* ── TRACKER ── */
.tracker-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;margin-bottom:12px;
}
.tracker-date{font-size:13px;color:var(--text3);margin-bottom:4px}
.tracker-kcal{font-size:36px;font-weight:700;letter-spacing:-1px;color:var(--text)}
.tracker-sub{font-size:13px;color:var(--text3);margin-top:2px;margin-bottom:14px}
.progress-wrap{background:rgba(255,255,255,0.06);border-radius:6px;height:5px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;border-radius:6px;background:var(--accent);transition:width 0.4s ease}
.stats-row{display:flex;gap:10px;margin-bottom:4px}
.stat-box{
  flex:1;background:var(--bg3);border-radius:12px;
  padding:12px;text-align:center;
}
.stat-val{font-size:20px;font-weight:700;color:var(--text)}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px}

.meal-list{margin-top:14px}
.meal-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--border2);
}
.meal-row:last-child{border-bottom:none}
.meal-icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--accent-dim);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.meal-info{flex:1}
.meal-name-t{font-size:14px;font-weight:600}
.meal-macros{font-size:12px;color:var(--text3);margin-top:2px}
.del-btn{
  background:none;border:none;
  color:rgba(255,255,255,0.15);
  font-size:18px;cursor:pointer;
  padding:4px 6px;
  transition:color 0.15s;
}
.del-btn:active{color:#c05050}

.add-meal-btn{
  width:100%;
  background:var(--bg3);
  border:1px dashed rgba(90,170,90,0.25);
  border-radius:var(--radius-sm);
  padding:12px;
  color:var(--accent);
  font-size:13px;font-weight:600;
  cursor:pointer;margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background 0.15s;
}
.add-meal-btn:active{background:var(--accent-dim)}

.add-form{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  margin-top:10px;display:none;
}
.add-form.open{display:block}
.form-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.form-input{
  width:100%;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:11px 13px;
  color:var(--text);font-size:14px;
  outline:none;margin-bottom:10px;
  font-family:inherit;
  transition:border-color 0.15s;
}
.form-input:focus{border-color:var(--accent)}
.form-row{display:flex;gap:8px;margin-bottom:10px}
.form-row .form-input{margin-bottom:0;flex:1}
.btn-row{display:flex;gap:8px}
.btn-primary{
  background:var(--accent);border:none;
  border-radius:var(--radius-sm);padding:10px 18px;
  color:#fff;font-size:13px;font-weight:700;cursor:pointer;
  transition:opacity 0.15s;
}
.btn-primary:active{opacity:0.8}
.btn-ghost{
  background:none;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 16px;
  color:var(--text3);font-size:13px;cursor:pointer;
}

/* ── SHOPPING ── */
.shop-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 0 12px;
}
.shop-cat{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:10px;
}
.shop-cat-header{
  padding:13px 16px;
  display:flex;justify-content:space-between;align-items:center;
}
.shop-cat-title{font-weight:600;font-size:14px}
.shop-cat-count{font-size:12px;color:var(--text3)}
.shop-items{padding:0 16px}
.shop-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--border2);
}
.shop-item:last-child{border-bottom:none}
.shop-check{
  width:22px;height:22px;border-radius:7px;
  border:2px solid rgba(255,255,255,0.15);
  background:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;
}
.shop-check.checked{background:var(--accent);border-color:var(--accent)}
.shop-check.checked::after{content:'✓';color:#fff;font-size:13px;font-weight:700;line-height:1}
.shop-item-name{font-size:14px;flex:1;transition:all 0.2s}
.shop-item-name.done{text-decoration:line-through;color:var(--text3)}
.del-shop{background:none;border:none;color:rgba(255,255,255,0.1);font-size:16px;cursor:pointer;padding:3px 5px;transition:color 0.15s}
.del-shop:active{color:#c05050}
.add-shop-row{
  display:flex;gap:8px;
  padding:10px 16px 14px;
  border-top:1px solid var(--border2);
}
.add-shop-row .form-input{margin:0;flex:1;font-size:13px}
.add-shop-btn{
  background:var(--accent);border:none;
  border-radius:var(--radius-sm);
  width:40px;height:40px;
  color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}

/* ── RECIPES ── */
.recipe-add-btn{
  width:100%;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  color:var(--accent);
  font-size:14px;font-weight:600;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:10px;
  transition:background 0.15s;
}
.recipe-add-btn:active{background:var(--bg3)}
.recipe-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:10px;
}
.recipe-header{
  padding:14px 16px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
}
.recipe-title{font-weight:600;font-size:14px}
.recipe-meta{font-size:12px;color:var(--text3);margin-top:3px}
.recipe-body{display:none;padding:0 16px 14px;border-top:1px solid var(--border2)}
.recipe-card.open .recipe-body{display:block}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  z-index:200;display:none;align-items:flex-end;
}
.modal-overlay.open{display:flex}
.modal{
  background:#1a1a1e;
  border-radius:24px 24px 0 0;
  border:1px solid var(--border);
  border-bottom:none;
  padding:20px 16px calc(24px + env(safe-area-inset-bottom));
  width:100%;max-height:90vh;overflow-y:auto;
}
.modal-drag{
  width:36px;height:4px;background:rgba(255,255,255,0.15);
  border-radius:2px;margin:0 auto 18px;
}
.modal-title{font-weight:700;font-size:18px;margin-bottom:16px}

/* ── EMPTY STATE ── */
.empty{
  text-align:center;padding:40px 20px;
  color:var(--text3);font-size:14px;
}
.empty-icon{font-size:36px;margin-bottom:10px}

/* ── COMBOS ── */
.combo-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;
}
.combo-label{font-weight:700;font-size:14px;margin-bottom:6px}
.combo-line{font-size:13px;color:var(--text2);margin-bottom:2px}
.combo-line.sub{color:var(--text3);font-size:12px;padding-left:8px}
.combo-footer{display:flex;gap:8px;margin-top:10px}
.combo-chip{
  background:var(--bg3);border-radius:20px;padding:3px 10px;
  font-size:11px;font-weight:600;
}
.combo-chip.kcal{color:#7bc97b}
.combo-chip.prot{color:#7bb5d9}
.combo-chip.time{color:var(--text3)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="header-greeting">Персональний помічник</div>
    <div class="header-title">Їжа 🥗</div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showPage('blocks')">
    <div class="nav-icon-wrap"><div class="nav-icon">🧩</div></div>
    <span class="nav-label">Блоки</span>
  </button>
  <button class="nav-btn" onclick="showPage('combos')">
    <div class="nav-icon-wrap"><div class="nav-icon">🍽️</div></div>
    <span class="nav-label">Комбо</span>
  </button>
  <button class="nav-btn" onclick="showPage('tracker')">
    <div class="nav-icon-wrap"><div class="nav-icon">📊</div></div>
    <span class="nav-label">Трекер</span>
  </button>
  <button class="nav-btn" onclick="showPage('shopping')">
    <div class="nav-icon-wrap"><div class="nav-icon">🛒</div></div>
    <span class="nav-label">Покупки</span>
  </button>
  <button class="nav-btn" onclick="showPage('recipes')">
    <div class="nav-icon-wrap"><div class="nav-icon">📖</div></div>
    <span class="nav-label">Рецепти</span>
  </button>
</nav>

<!-- PAGE: BLOCKS -->
<div id="page-blocks" class="page active">
  <div class="section-header">
    <div class="section-title">Блоки</div>
    <div class="section-sub">Готуєш × 3</div>
  </div>
</div>

<!-- PAGE: COMBOS -->
<div id="page-combos" class="page">
  <div class="section-header">
    <div class="section-title">Комбо</div>
    <div class="section-sub">Готові поєднання</div>
  </div>
  <div id="combos-list"></div>
</div>

<!-- PAGE: TRACKER -->
<div id="page-tracker" class="page">
  <div class="section-header">
    <div class="section-title">Трекер</div>
  </div>
  <div class="tracker-card">
    <div class="tracker-date" id="tracker-date"></div>
    <div class="tracker-kcal"><span id="t-kcal">0</span> <span style="font-size:18px;color:var(--text3)">ккал</span></div>
    <div class="tracker-sub">Ціль: 2300 ккал · <span id="t-prot">0</span>г / 160г білка</div>
    <div class="progress-wrap"><div class="progress-fill" id="kcal-bar" style="width:0%"></div></div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val" id="s-kcal">0</div>
        <div class="stat-label">ккал</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="s-prot">0</div>
        <div class="stat-label">білок г</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="s-pct">0%</div>
        <div class="stat-label">від цілі</div>
      </div>
    </div>
    <div class="meal-list" id="meal-list"></div>
    <button class="add-meal-btn" onclick="toggleAddMeal()">
      <span style="font-size:18px">+</span> Додати прийом їжі
    </button>
    <div class="add-form" id="add-meal-form">
      <div class="form-label">Назва страви</div>
      <input class="form-input" id="meal-name-input" placeholder="напр. Куряча грудка з гречкою">
      <div class="form-row">
        <div style="flex:1">
          <div class="form-label">Калорії</div>
          <input class="form-input" id="meal-kcal-input" type="number" placeholder="ккал">
        </div>
        <div style="flex:1">
          <div class="form-label">Білок г</div>
          <input class="form-input" id="meal-prot-input" type="number" placeholder="г">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="addMealEntry()">Додати</button>
        <button class="btn-ghost" onclick="toggleAddMeal()">Скасувати</button>
      </div>
    </div>
  </div>
  <button class="btn-ghost" style="width:100%" onclick="clearDay()">Очистити день</button>
</div>

<!-- PAGE: SHOPPING -->
<div id="page-shopping" class="page">
  <div class="shop-header">
    <div class="section-title">Покупки</div>
    <button class="btn-ghost" style="font-size:12px;padding:6px 12px" onclick="clearChecked()">Очистити відмічені</button>
  </div>
  <div id="shop-list"></div>
</div>

<!-- PAGE: RECIPES -->
<div id="page-recipes" class="page">
  <div class="section-header">
    <div class="section-title">Рецепти</div>
  </div>
  <button class="recipe-add-btn" onclick="openAddRecipe()">
    <span style="font-size:20px">+</span> Додати свій рецепт
  </button>
  <div id="recipes-list"></div>
</div>

<!-- MODAL: Add Recipe -->
<div class="modal-overlay" id="recipe-modal">
  <div class="modal">
    <div class="modal-drag"></div>

  { cat:"🥦 Овочі", items:[{n:"Огірки 1кг"},{n:"Помідори черрі 500г"},{n:"Болгарський перець 4шт"},{n:"Листовий салат 2 головки"},{n:"Броколі 400г"},{n:"Цукіні 2шт"},{n:"Морква 4шт"},{n:"Авокадо 3шт"}] },
  { cat:"🌾 Крупи та бобові", items:[{n:"Вівсяні пластівці 500г"},{n:"Гречка 500г"},{n:"Рис 500г"},{n:"Червона сочевиця 300г"}] },
  { cat:"🥜 Горіхи та насіння", items:[{n:"Мигдаль 150г"},{n:"Волоські горіхи 100г"},{n:"Насіння льону або чіа"}] },
  { cat:"🧴 Інше", items:[{n:"Мигдальне молоко без цукру 2л"},{n:"Оливкова олія extra virgin"},{n:"Лимони 4шт"},{n:"Часник 1 головка"}] },
];

// ── STATE ──
let mealEntries = JSON.parse(localStorage.getItem('meals') || '[]');
let shopItems = JSON.parse(localStorage.getItem('shop') || 'null');
let userRecipes = JSON.parse(localStorage.getItem('recipes') || '[]');
if (!shopItems) shopItems = DEFAULT_SHOPPING.map(c => ({ cat:c.cat, items:c.items.map(i=>({n:i.n,c:false})) }));

function save() {
  localStorage.setItem('meals', JSON.stringify(mealEntries));
  localStorage.setItem('shop', JSON.stringify(shopItems));
  localStorage.setItem('recipes', JSON.stringify(userRecipes));
}

// ── NAV ──
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  const idx = ['blocks','combos','tracker','shopping','recipes'].indexOf(name);
  document.querySelectorAll('.nav-btn')[idx].classList.add('active');
  if (name==='tracker') renderTracker();
  if (name==='shopping') renderShopping();
  if (name==='recipes') renderRecipes();
}

// ── BLOCKS ──
const itemStore = {};
function renderBlocks() {
  const wrap = document.getElementById('page-blocks');
  BLOCKS_DATA.forEach((block, bi) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.cssText = `background:${block.color};border-color:${block.border}`;
    card.innerHTML = `
      <div class="card-header" onclick="this.closest('.card').classList.toggle('open')">
        <div>
          <div class="card-title" style="color:${block.accent}">${block.category}</div>
          <div class="card-desc">${block.desc}</div>
        </div>
        <div class="chevron">▾</div>
      </div>
      <div class="card-body" id="cb${bi}"></div>`;
    wrap.appendChild(card);
    const body = document.getElementById('cb'+bi);
    block.items.forEach((item, ii) => {
      const k = `${bi}_${ii}`;
      itemStore[k] = {item, accent: block.accent};
      const tagsHtml = item.tags.map(t=>`<span class="tag">${t}</span>`).join('');
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div class="item-header" onclick="toggleItem(this,'${k}')">
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-meta">
              <span class="kcal-badge">🔥 ${item.kcal} ккал / ${item.per}</span>
              <span class="prot-badge">💪 ${item.protein}г білка</span>
              ${tagsHtml}
            </div>
          </div>
          <div class="item-chevron">▾</div>
        </div>
        <div class="item-body" id="ib${k}"></div>`;
      body.appendChild(el);
    });
  });
}

function toggleItem(header, k) {
  const item_el = header.closest('.item');
  item_el.classList.toggle('open');
  const body = document.getElementById('ib'+k);
  if (item_el.classList.contains('open') && !body.innerHTML) {
    let {item, accent} = itemStore[k];
    // normalize methods wrapper
    if (item.methods) { item = {...item, g:item.methods.g||item.methods.gorenje, s:item.methods.s||item.methods.stove, o:item.methods.o||item.methods.oven}; itemStore[k].item = item; }
    body.innerHTML = buildBody(k, item, accent);
  }
}

function buildBody(k, item, accent) {
  return `
    <div class="method-tabs">
      <button class="mt-btn active-g" id="mt${k}_g" onclick="setM('${k}','g')">🫕 Gorenje</button>
      <button class="mt-btn" id="mt${k}_s" onclick="setM('${k}','s')">🍳 Плита</button>
      <button class="mt-btn" id="mt${k}_o" onclick="setM('${k}','o')">🔥 Духовка</button>
    </div>
    <div class="time-pill tp-g" id="tp${k}">⏱ ${item.g.time}${item.g.btn&&item.g.btn!=='—'?' · '+item.g.btn:''}</div>
    <div class="slabel">Інгредієнти</div>
    ${item.ing.map(i=>`<div class="ing-item"><div class="ing-dot"></div>${i}</div>`).join('')}
    <div class="slabel">Кроки</div>
    <div id="st${k}">${stepsH(item.g.steps)}</div>
    <button class="xbtn" onclick="xToggle('xp${k}','xa${k}')">
      <span>🤝 З чим поєднується</span><span id="xa${k}">▾</span>
    </button>
    <div class="expandable" id="xp${k}">${item.pairs.map(p=>`<span class="pair-chip">${p}</span>`).join('')}</div>
    <button class="xbtn" onclick="xToggle('xs${k}','xb${k}')">
      <span>🔄 Варіанти заміни</span><span id="xb${k}">▾</span>
    </button>
    <div class="expandable" id="xs${k}">${item.subs.map(s=>`<div class="sub-row"><span class="sub-arrow">→</span>${s}</div>`).join('')}</div>`;
}

function stepsH(steps) {
  return steps.map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div>${s}</div>`).join('');
}

function setM(k, m) {
  ['g','s','o'].forEach(x => {
    document.getElementById(`mt${k}_${x}`).className = 'mt-btn' + (x===m?' active-'+m:'');
  });
  const {item} = itemStore[k];
  const mdata = item.methods || item;
  const tp = document.getElementById('tp'+k);
  tp.className = `time-pill tp-${m}`;
  tp.textContent = `⏱ ${item[m].time}${item[m].btn&&item[m].btn!=='—'?' · '+item[m].btn:''}`;
  document.getElementById('st'+k).innerHTML = stepsH(item[m].steps);
}

function xToggle(id, aid) {
  const el = document.getElementById(id);
  const arrow = document.getElementById(aid);
  const isOpen = el.classList.contains('open') || el.classList.contains('open-col');
  if (isOpen) { el.classList.remove('open','open-col'); arrow.textContent='▾'; }
  else { el.classList.add(id.startsWith('xs') ? 'open-col':'open'); arrow.textContent='▴'; }
}

// ── COMBOS ──
function renderCombos() {
  const wrap = document.getElementById('combos-list');
  COMBOS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'combo-card';
    el.innerHTML = `
      <div class="combo-label">${c.label}</div>
      ${c.lines.map((l,i)=>`<div class="combo-line${i>0?' sub':''}">${l}</div>`).join('')}
      <div class="combo-footer">
        <span class="combo-chip kcal">🔥 ${c.kcal} ккал</span>
        <span class="combo-chip prot">💪 ${c.protein}г</span>
        <span class="combo-chip time">⏱ ${c.time}</span>
      </div>`;
    wrap.appendChild(el);
  });
}

// ── TRACKER ──
function renderTracker() {
  const now = new Date();
  document.getElementById('tracker-date').textContent = now.toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});
  const tot = mealEntries.reduce((a,e)=>({k:a.k+(e.k||0),p:a.p+(e.p||0)}),{k:0,p:0});
  const pct = Math.min(100, Math.round(tot.k/2300*100));
  document.getElementById('t-kcal').textContent = tot.k;
  document.getElementById('t-prot').textContent = tot.p;
  document.getElementById('s-kcal').textContent = tot.k;
  document.getElementById('s-prot').textContent = tot.p;
  document.getElementById('s-pct').textContent = pct+'%';
  document.getElementById('kcal-bar').style.width = pct+'%';
  document.getElementById('kcal-bar').style.background = pct>100?'#c05050':'var(--accent)';
  const list = document.getElementById('meal-list');
  const icons = ['🍳','🍱','🥗','🍽️','🥜','🍖','🐟','🥦'];
  list.innerHTML = mealEntries.length
    ? mealEntries.map((e,i)=>`
      <div class="meal-row">
        <div class="meal-icon">${icons[i%icons.length]}</div>
        <div class="meal-info">
          <div class="meal-name-t">${e.n}</div>
          <div class="meal-macros">${e.k} ккал · ${e.p}г білка</div>
        </div>
        <button class="del-btn" onclick="delMeal(${i})">×</button>
      </div>`).join('')
    : '<div class="empty" style="padding:20px 0"><div class="empty-icon">🍽️</div>Ще нічого не додано</div>';
}

function toggleAddMeal() {
  document.getElementById('add-meal-form').classList.toggle('open');
}
function addMealEntry() {
  const n = document.getElementById('meal-name-input').value.trim();
  const k = parseInt(document.getElementById('meal-kcal-input').value)||0;
  const p = parseInt(document.getElementById('meal-prot-input').value)||0;
  if (!n) return;
  mealEntries.push({n,k,p}); save();
  document.getElementById('meal-name-input').value='';
  document.getElementById('meal-kcal-input').value='';
  document.getElementById('meal-prot-input').value='';
  document.getElementById('add-meal-form').classList.remove('open');
  renderTracker();
}
function delMeal(i){ mealEntries.splice(i,1); save(); renderTracker(); }
function clearDay(){ if(confirm('Очистити весь день?')){mealEntries=[];save();renderTracker();} }

// ── SHOPPING ──
function renderShopping() {
  const wrap = document.getElementById('shop-list');
  wrap.innerHTML = '';
  shopItems.forEach((cat,ci)=>{
    const done = cat.items.filter(i=>i.c).length;
    const el = document.createElement('div');
    el.className = 'shop-cat';
    el.innerHTML = `
      <div class="shop-cat-header">
        <div class="shop-cat-title">${cat.cat}</div>
        <div class="shop-cat-count">${done}/${cat.items.length}</div>
      </div>
      <div class="shop-items" id="sc${ci}">
        ${cat.items.map((item,ii)=>`
          <div class="shop-item">
            <div class="shop-check ${item.c?'checked':''}" onclick="toggleShop(${ci},${ii})"></div>
            <span class="shop-item-name ${item.c?'done':''}">${item.n}</span>
            <button class="del-shop" onclick="delShop(${ci},${ii})">×</button>
          </div>`).join('')}
      </div>
      <div class="add-shop-row">
        <input class="form-input" id="si${ci}" placeholder="Додати продукт..." onkeydown="if(event.key==='Enter')addShop(${ci})">
        <button class="add-shop-btn" onclick="addShop(${ci})">+</button>
      </div>`;
    wrap.appendChild(el);
  });
}
function toggleShop(ci,ii){shopItems[ci].items[ii].c=!shopItems[ci].items[ii].c;save();renderShopping();}
function delShop(ci,ii){shopItems[ci].items.splice(ii,1);save();renderShopping();}
function addShop(ci){
  const inp=document.getElementById('si'+ci);
  const v=inp.value.trim(); if(!v)return;
  shopItems[ci].items.push({n:v,c:false}); inp.value=''; save(); renderShopping();
}
function clearChecked(){shopItems.forEach(c=>{c.items=c.items.filter(i=>!i.c)});save();renderShopping();}

// ── RECIPES ──
function renderRecipes() {
  const wrap = document.getElementById('recipes-list');
  wrap.innerHTML = '';
  if (!userRecipes.length) {
    wrap.innerHTML = '<div class="empty"><div class="empty-icon">📖</div>Ще немає своїх рецептів</div>';
    return;
  }
  userRecipes.forEach((r,ri)=>{
    const el = document.createElement('div');
    el.className = 'recipe-card';
    el.innerHTML = `
      <div class="recipe-header" onclick="this.closest('.recipe-card').classList.toggle('open')">
        <div>
          <div class="recipe-title">${r.name}</div>
          <div class="recipe-meta">${r.kcal} ккал · ${r.prot}г білка</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button onclick="event.stopPropagation();delRecipe(${ri})" style="background:none;border:none;color:rgba(255,255,255,0.2);font-size:16px;cursor:pointer">×</button>
          <div class="chevron">▾</div>
        </div>
      </div>
      <div class="recipe-body">
        ${r.ing?`<div class="slabel">Інгредієнти</div>${r.ing.split('\n').map(i=>`<div class="ing-item"><div class="ing-dot"></div>${i}</div>`).join('')}`:''}
        ${r.steps?`<div class="slabel">Кроки</div>${r.steps.split('\n').map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div>${s}</div>`).join('')}`:''}
      </div>`;
    wrap.appendChild(el);
  });
}
function openAddRecipe(){
  ['r-name','r-kcal','r-prot','r-ing','r-steps'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('recipe-modal').classList.add('open');
}
function saveRecipe(){
  const name=document.getElementById('r-name').value.trim(); if(!name)return;
  userRecipes.push({name,kcal:parseInt(document.getElementById('r-kcal').value)||0,prot:parseInt(document.getElementById('r-prot').value)||0,ing:document.getElementById('r-ing').value.trim(),steps:document.getElementById('r-steps').value.trim()});
  save(); closeModal('recipe-modal'); renderRecipes();
}
function delRecipe(i){if(confirm('Видалити?')){userRecipes.splice(i,1);save();renderRecipes();}}
function closeModal(id){document.getElementById(id).classList.remove('open');}

// ── INIT ──
renderBlocks();
renderCombos();
renderTracker();
</script>
</body>
</html>
